<html lang="en">
<head>
<meta charset="utf-8" />

<title>Big Ante Range Explorer – Felt Experience Poker</title>

<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@500;600;700&family=Montserrat:wght@400;500;600&family=Inter:wght@400;500;600&display=swap">
</head>
<body>
<script>
  // Dark unless a light preference was saved.
  let t = 'dark';
  try { if (localStorage.getItem('fe-theme-v1') === 'light') t = 'light'; } catch (e) { /* storage can be unavailable */ }
  document.documentElement.dataset.theme = t;
</script>
<style>
  /* Neutral charcoal in dark, cool gray in light: the grids carry the color,
     so the page around them stays out of the way. */
  :root {
    --bg: #f2f3f5; --panel: #ffffff; --sunk: #eceef1; --line: #dcdfe4;
    --ink: #16191d; --muted: #4f5660; --faint: #737a84;
    --raise: #e95858; --jam: #7c2d8a; --call: #4f9a52; --fold: #a7adb6; --oor: #e4e7eb;
    --shadow: 0 1px 2px rgba(20,24,30,.06), 0 6px 18px rgba(20,24,30,.06);
    --focus: #2f6d8f;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121418; --panel: #1a1d22; --sunk: #15181c; --line: #2a2f37;
      --ink: #eceef1; --muted: #c2c7cf; --faint: #9aa1ab;
      --raise: #e95858; --jam: #9c4bab; --call: #43904a; --fold: #2c3139; --oor: #1a1d22;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.34);
      --focus: #7fb6d4;
    }
  }
  :root[data-theme="dark"] {
    --bg: #121418; --panel: #1a1d22; --sunk: #15181c; --line: #2a2f37;
    --ink: #eceef1; --muted: #c2c7cf; --faint: #9aa1ab;
    --raise: #e95858; --jam: #9c4bab; --call: #43904a; --fold: #2c3139; --oor: #1a1d22;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.34);
    --focus: #7fb6d4;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: Montserrat, ui-sans-serif, system-ui, sans-serif;
    font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased;
  }
  .shell { max-width: 1400px; margin: 0 auto; padding: 22px 20px 52px; }

  .top { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 16px; }
  .top a { font-size: 13px; color: var(--muted); }
  .gameseg { align-self: center; }
  .gameseg button { font-size: 13px; padding: 6px 14px; }
  .gameseg button[aria-pressed="true"] { color: var(--call); }
  .card[hidden] { display: none; }
  h1 {
    font-family: 'League Spartan', system-ui, sans-serif; font-weight: 700;
    font-size: clamp(23px, 2.5vw, 30px); letter-spacing: -.015em;
    margin: 0; color: var(--ink);
  }

  .card {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; box-shadow: var(--shadow); padding: 16px;
  }
  .card > h2 {
    font-family: Inter, ui-sans-serif, system-ui, sans-serif; font-size: 12.5px;
    font-weight: 600; letter-spacing: .11em; text-transform: uppercase;
    color: var(--muted); margin: 0 0 12px;
  }

  /* ---- picker: two groups per row, in one grid so the four boxes line up ----
     The groups are display:contents so their label and their segment become
     grid items in their own right, which is what lets a column be shared
     between the row above and the row below. */
  /* The settings sit at the top of the grid's own card, ruled off from it,
     so the two read as one panel. */
  .picker { margin-top: -2px; margin-bottom: 18px; padding: 0 0 16px; border-bottom: 1px solid var(--line);
            display: flex; flex-direction: column; gap: 11px; }
  /* Each setting is a label and its buttons, kept together: when a line runs
     out of room a whole setting moves down rather than splitting. The spot
     always starts the second line, so it stays put as other settings come and go. */
  .prow { display: flex; flex-direction: column; gap: 12px; }
  .pline { display: flex; flex-wrap: wrap; gap: 12px 30px; align-items: center; }
  .grp { display: flex; align-items: center; gap: 12px; }
  /* Each box hugs its own buttons rather than filling the column: the raiser
     list is one entry in some spots, and a lone button in a full-width box
     reads like an empty field. The shared left edge carries the alignment. */
  .picker .seg { justify-self: start; }
  .lbl {
    font-family: Inter, ui-sans-serif, system-ui, sans-serif; font-size: 13px; font-weight: 500;
    letter-spacing: .09em; text-transform: uppercase; color: var(--muted); white-space: nowrap;
  }
  .seg { display: flex; flex-wrap: wrap; gap: 3px; background: var(--sunk); border: 1px solid var(--line); border-radius: 9px; padding: 3px; }
  .seg button {
    appearance: none; border: 0; background: transparent; color: var(--muted);
    font-family: Inter, ui-sans-serif, system-ui, sans-serif; font-size: 13.5px;
    padding: 6px 12px; border-radius: 6px; cursor: pointer; white-space: nowrap;
  }
  .seg button:hover:not([disabled]) { color: var(--ink); }
  .seg button[aria-pressed="true"] { background: var(--panel); color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.16); }
  .seg button[disabled] { opacity: .3; cursor: not-allowed; }
  .seg button:focus-visible, .cell:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  /* Drawn inside the cell: the grid scrolls sideways on small screens, and its
     overflow clips anything outside the cell edge on the bottom row. */
  .cell.linked { outline: 2px solid var(--focus); outline-offset: -2px; }

  .cols { display: grid; grid-template-columns: minmax(0,1fr) 310px; gap: 18px; align-items: start; }

  /* ---- grid ---- */
  .gridhead { display: flex; justify-content: space-between; align-items: baseline; gap: 14px; flex-wrap: wrap; margin-bottom: 12px; }
  .gridhead strong { font-family: Inter, ui-sans-serif, system-ui, sans-serif; font-size: 18px; font-weight: 600; }
  /* Title on the left, what happened on the right, one line: the Strategy
     card carries the frequencies, so the grid can start higher. */
  .gridhead .sub { font-size: 15px; color: var(--muted); font-family: Inter, ui-sans-serif, system-ui, sans-serif; font-weight: 400; }
  .mix { font-family: Inter, ui-sans-serif, system-ui, sans-serif; font-size: 15px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .mix .k { display: inline-block; width: 11px; height: 11px; border-radius: 2px; margin: 0 7px 0 16px; }
  .mix .k:first-child { margin-left: 0; }
  .mix .k.r { background: var(--raise); }
  .mix .k.j { background: var(--jam); }
  .mix .k.c { background: var(--call); }
  .mix .k.f { background: var(--fold); }

  /* The grid is square, so at full column width it runs well below the fold on
     a laptop. Cap it by the height actually available, and let the labels keep
     a floor so shrinking the grid does not shrink them out of readability. */
  .gridwrap {
    overflow-x: auto; container-type: inline-size; margin-inline: auto;
    max-width: min(100%, max(660px, 100vh - 250px));
    max-width: min(100%, max(660px, 100dvh - 250px));
  }
  /* The heading and legend track the grid's width so they line up with its
     edges rather than the full card. */
  .gridhead {
    margin-inline: auto;
    max-width: min(100%, max(660px, 100vh - 250px));
    max-width: min(100%, max(660px, 100dvh - 250px));
  }
  .grid { display: grid; grid-template-columns: repeat(13, minmax(36px, 1fr)); gap: 2px; min-width: 500px; }

  .cell {
    appearance: none; border: 0; aspect-ratio: 1; border-radius: 4px;
    font-family: Inter, ui-sans-serif, system-ui, sans-serif;
    font-size: clamp(11px, 2.3cqw, 17px); font-weight: 500; letter-spacing: .02em;
    /* Top left like Wizard. With the fills running left to right a centred
       label often straddles a color boundary; this one sits on a single band. */
    display: flex; align-items: flex-start; justify-content: flex-start;
    padding: .35em 0 0 .45em;
    cursor: pointer; position: relative; overflow: hidden;
    color: #fff; transition: opacity .15s ease, transform .1s ease;
  }
  .cell:hover { transform: translateY(-1px); z-index: 4; }
  .cell .t { position: relative; z-index: 2; text-shadow: 0 1px 1px rgba(0,0,0,.3); }
  .cell.oor { color: var(--faint); }
  .cell.oor .t { text-shadow: none; opacity: .55; }

  /* ---- rail ---- */
  .rail { display: flex; flex-direction: column; gap: 16px; }
  .big { display: flex; align-items: baseline; gap: 8px; }
  .big .n {
    font-family: 'League Spartan', system-ui, sans-serif; font-size: 40px;
    font-weight: 700; line-height: 1; letter-spacing: -.03em; color: var(--raise);
    font-variant-numeric: tabular-nums;
  }
  .big .u { font-size: 14px; color: var(--muted); }
  .bigsub { margin: 8px 0 0; font-size: 13px; color: var(--muted); }

  .detail .hand { font-family: Inter, ui-sans-serif, system-ui, sans-serif; font-size: 27px; font-weight: 600; margin: 0; line-height: 1.1; }
  .detail .verdict { font-size: 14px; font-weight: 600; margin: 3px 0 0; color: var(--muted); }
  .detail .nums { margin: 6px 0 8px; font-size: 14px; font-variant-numeric: tabular-nums;
                  display: flex; flex-direction: column; gap: 2px; }
  .detail .nums .a { font-weight: 600; }
  .detail .nums .raise { color: var(--raise); }
  .detail .nums .jam { color: var(--jam); }
  .detail .nums .call { color: var(--call); }
  .detail .nums .fold { color: var(--muted); }
  .detail .why { margin: 0; font-size: 13px; color: var(--muted); }

  #notes { margin: 0; font-size: 14px; color: var(--muted); line-height: 1.55; }

  /* ---- strategy: one row per action, the number in its grid color ---- */
  .ov { display: flex; flex-direction: column; gap: 7px; }
  .ov-row { display: flex; justify-content: space-between; gap: 10px;
            font-family: Inter, ui-sans-serif, system-ui, sans-serif; font-size: 15px; }
  .ov-row { font-weight: 600; }
  .ov-row .pc { font-variant-numeric: tabular-nums; }
  .ov-row.r .pc { color: var(--raise); } .ov-row.j .pc { color: var(--jam); }
  .ov-row.c .pc { color: var(--call); } .ov-row.f .pc { color: var(--muted); }

  .theme button { font-size: 13px; padding: 5px 12px; }
  .foot { margin: 22px 0 0; font-size: 13px; color: var(--faint); }
  .foot a { color: var(--muted); }

  @media (max-width: 920px) {
    .cols { grid-template-columns: minmax(0,1fr); }
  }
</style>

<div class="shell">
  <div class="top">
    <h1>Big Ante Range Explorer</h1>
    <div class="seg theme" role="group" aria-label="Color theme" id="theme-seg"></div>
    <a href="/study/big-ante-drill">Drill these ranges</a>
  </div>

  <div class="cols">
    <div class="card">
      <div class="picker">
        <div class="prow">
          <div class="pline">
            <div class="grp"><span class="lbl" id="l5">Game</span><div class="seg" role="group" aria-labelledby="l5" id="game-seg"></div></div>
            <div class="grp"><span class="lbl" id="l6">Depth</span><div class="seg" role="group" aria-labelledby="l6" id="stack-seg"></div></div>
            <div class="grp"><span class="lbl" id="l1">Position</span><div class="seg" role="group" aria-labelledby="l1" id="hero-seg"></div></div>
          </div>
          <div class="pline">
            <div class="grp"><span class="lbl" id="l2">Facing</span><div class="seg" role="group" aria-labelledby="l2" id="fam-seg"></div></div>
            <div class="grp" id="vs-grp"><span class="lbl" id="l3">Raiser</span><div class="seg" role="group" aria-labelledby="l3" id="vs-seg"></div></div>
            <div class="grp" id="size-grp"><span class="lbl" id="l4">Size</span><div class="seg" role="group" aria-labelledby="l4" id="size-seg"></div></div>
          </div>

      </div>
      <div class="gridhead">

    <div class="rail">

        <h2 id="ours-label">Our 3-bet</h2>
        <div class="big"><span class="n" id="ours">–</span><span class="u">bb</span></div>
        <p class="bigsub" id="ours-sub"></p>

  <p class="foot"><a href="https://feltexperiencepoker.com" target="_blank" rel="noopener">Felt Experience Poker</a></p>

<script src="/study/bigante-ranges.js"></script>
<script>
(function(){
"use strict";


/* ===========================================================================
   Big Ante range explorer.
   =========================================================================== */

const RANKS = ['A','K','Q','J','T','9','8','7','6','5','4','3','2'];
const VAL = { A:14,K:13,Q:12,J:11,T:10,9:9,8:8,7:7,6:6,5:5,4:4,3:3,2:2 };

const HANDS = [];
for (let i = 0; i < 13; i++) {
  for (let j = 0; j < 13; j++) {
    const a = VAL[RANKS[i]], b = VAL[RANKS[j]];
    const hi = Math.max(a, b), lo = Math.min(a, b);
    HANDS.push({
      code: i === j ? RANKS[i] + RANKS[i]
        : (i < j ? RANKS[i] + RANKS[j] + 's' : RANKS[j] + RANKS[i] + 'o'),
      kind: i === j ? 'pair' : (i < j ? 's' : 'o'),
      hi, lo, gap: i === j ? 0 : hi - lo - 1,
    });
  }
}

function decode(row) {
  return row.split(',').map((tok, n) => {
    const h = HANDS[n];
    if (tok === 'X') return { h, oor: true, r: 0, j: 0, c: 0, f: 0 };
    const est = tok.endsWith('!');
    const [r, j, c] = (est ? tok.slice(0, -1) : tok).split('.').map(Number);
    return { h, r, j, c, f: Math.max(0, 100 - r - j - c), est };
  });
}

/* One straight bar per cell: raise, then jam, then call, then fold. No
   hatching, so a 20% fold simply shows as a fifth of the cell in fold gray. */
function paint(c) {
  if (c.oor) return 'var(--oor)';
  const r = c.r, j = r + c.j, k = j + c.c;
  const stops = [];
  if (r > 0) stops.push(`var(--raise) 0 ${r}%`);
  if (c.j > 0) stops.push(`var(--jam) ${r}% ${j}%`);
  if (c.c > 0) stops.push(`var(--call) ${j}% ${k}%`);
  if (c.f > 0) stops.push(`var(--fold) ${k}% 100%`);
  if (!stops.length) return 'var(--fold)';
  if (stops.length === 1) {
    return c.f >= 99.5 ? 'var(--fold)' : c.c >= 99.5 ? 'var(--call)'
      : c.j >= 99.5 ? 'var(--jam)' : 'var(--raise)';
  }
  return `linear-gradient(to right, ${stops.join(', ')})`;
}

const FAM_ORDER = [
  { id: 'first', label: 'First in' },
  { id: 'rfi',  label: 'vs RFI' },
  { id: 'limp', label: 'Limp vs ISO' },
  { id: 'vs3b', label: 'vs 3-bet' },
  { id: 'hurfi',   label: 'vs Open' },
  { id: 'huvs3b',  label: 'vs 3-bet' },
  { id: 'huvs4b',  label: 'vs 4-bet' },
  { id: 'huvsjam', label: 'vs Jam' },
];
const HERO_ORDER = ['BB', 'SB', 'BTN', 'CO', 'HJ', 'UTG'];
/* The players we face are listed nearest seat first, counted along the
   preflop action. EP is UTG and HJ together, so it takes UTG's seat. */
const ACTION = ['UTG', 'HJ', 'CO', 'BTN', 'SB', 'BB'];
const seat = (p) => ACTION.indexOf(p === 'EP' ? 'UTG' : p);
const away = (sp) => (sp.vs ? Math.abs(seat(sp.hero) - seat(sp.vs)) : 0);
/* The size card names our own bet where we have one. Facing a jam there is no
   raise left, so that spot has nothing to put there and the card comes off. */
const OURS_LABEL = {
  first: 'Our open', rfi: 'Our 3-bet', vs3b: 'Their 3-bet', limp: 'Our 3-bet',
  hurfi: 'Our 3-bet', huvs3b: 'Our jam', huvs4b: 'Our jam', huvsjam: null,
};
const GAME_LABEL = { '6max': '6-max', hu: 'Heads up' };
/* Why a hand is missing from a grid depends on the node. Facing a 4-bet or a
   jam, the hand was dealt and defended; it just did not 3-bet. */
const OOR_LABEL = {
  vs3b: 'opening', limp: 'limping', huvs3b: 'opening',
  huvs4b: '3-betting', huvsjam: '3-betting',
};
const oorText = (fam) => `Not in our ${OOR_LABEL[fam] || 'opening'} range`;
/* A spot can rename an action: first in, the green action is a limp and the
   red one an open. */
const word = (sp, k) => (sp && sp.words && sp.words[k]) || k;
const GAME_KEY = 'fe-bigante-game-v1';

/* The size is held by its face rather than its index, so switching who
   opened keeps you on the same price where the new spot has one. */
const STACKS = [75, 100, 125, 150];
const STACK_KEY = 'fe-bigante-stack-v1';

const state = { game: '6max', stack: 100, hero: 'SB', fam: 'rfi', vs: null, face: null };
try { const v = localStorage.getItem(GAME_KEY); if (v && GAME_LABEL[v]) state.game = v; }
catch (e) { /* storage can be unavailable; the default stands */ }
try { const v = Number(localStorage.getItem(STACK_KEY)); if (STACKS.includes(v)) state.stack = v; }
catch (e) { /* ditto */ }

const $ = (id) => document.getElementById(id);
const inStack = () => SPOT_DATA.filter((s) => s.stack === state.stack);
const inGame = () => inStack().filter((s) => s.game === state.game);
const branch = () => inGame().filter((s) => s.hero === state.hero && s.fam === state.fam)
  .sort((a, b) => away(a) - away(b));
const spot = () => branch().find((s) => s.vs === state.vs) || branch()[0] || null;

const cells = [];
(function build() {
  const grid = $('grid');
  HANDS.forEach((h) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'cell';
    b.innerHTML = '<span class="t"></span>';
    b.querySelector('.t').textContent = h.code;
    grid.appendChild(b);
    cells.push(b);
  });
})();

function seg(id, items, isOn, pick) {
  const box = $(id);
  box.innerHTML = '';
  items.forEach((it) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = it.label;
    b.setAttribute('aria-pressed', String(isOn(it)));
    if (it.off) { b.disabled = true; b.title = it.offText || 'No data for this position'; }
    else b.addEventListener('click', () => pick(it));
    box.appendChild(b);
  });
}

function clearDetail() {
  $('d-hand').textContent = '–';
  $('d-verdict').textContent = 'Hover any hand';
  $('d-nums').innerHTML = '';
  $('d-why').textContent = '';
}

function detail(c) {
  $('d-hand').textContent = c.h.code;
  if (c.oor) {
    $('d-verdict').textContent = oorText(spot().fam);
    $('d-nums').innerHTML = '';
    $('d-why').textContent = 'This hand never reaches the spot, so there is nothing to decide.';
    return;
  }
  $('d-verdict').textContent = '';
  // Each frequency wears the color it has on the grid.
  const parts = [];
  const sp = spot();
  if (c.r) parts.push(`<span class="a raise">${c.r}% ${word(sp, 'raise')}</span>`);
  if (c.j) parts.push(`<span class="a jam">${c.j}% jam</span>`);
  if (c.c) parts.push(`<span class="a call">${c.c}% ${word(sp, 'call')}</span>`);
  if (c.f) parts.push(`<span class="a fold">${c.f}% fold</span>`);
  $('d-nums').innerHTML = parts.join('');
  $('d-why').textContent = c.est
    ? 'Estimated: this cell was under the cursor in the source capture.' : '';
}

function render() {
  /* Which spots exist depends on the depth: limped pots and heads-up were only
     ever solved at 100bb, and the open sizes differ between depths too. Settle
     the stack first, then let the rest of the picker fall back as it already
     does when a position has no data. */
  const depths = STACKS.filter((n) => SPOT_DATA.some((s) => s.stack === n && s.game === state.game));
  if (!depths.includes(state.stack)) state.stack = depths.includes(100) ? 100 : depths[0];
  const here = inGame();
  const heroes = HERO_ORDER.filter((h) => here.some((s) => s.hero === h));
  if (!heroes.includes(state.hero)) state.hero = heroes[0];
  const fams = FAM_ORDER.filter((f) => here.some((s) => s.hero === state.hero && s.fam === f.id));
  if (!fams.some((f) => f.id === state.fam)) state.fam = fams[0].id;
  const opts = branch();
  if (!opts.some((s) => s.vs === state.vs)) state.vs = opts[0] ? opts[0].vs : null;

  const sp = spot();
  if (!sp) return;
  /* Comparing 3x from the cutoff against 3x from the button is the whole
     point of switching raiser, so hold the face across the change and only
     fall back to the smallest when the new spot does not offer it. */
  let si = sp.sizes.findIndex((z) => z.face === state.face);
  if (si < 0) si = 0;
  state.face = sp.sizes[si].face;
  const size = sp.sizes[si];
  const now = decode(size.g);

  seg('game-seg', Object.entries(GAME_LABEL).map(([v, label]) => ({ label, v })),
    (it) => it.v === state.game,
    (it) => {
      state.game = it.v;
      try { localStorage.setItem(GAME_KEY, it.v); } catch (e) { /* ignore */ }
      /* Don't reach into inGame() here: heads up only exists at 100bb, so from
         any other depth that list is empty. render() settles the stack first
         and then walks position, facing and raiser down to something real. */
      state.vs = null;
      render();
    });

  seg('stack-seg', STACKS.map((n) => ({
      label: n + 'bb', v: n,
      off: !SPOT_DATA.some((z) => z.stack === n && z.game === state.game),
    })),
    (it) => it.v === state.stack,
    (it) => {
      state.stack = it.v;
      try { localStorage.setItem(STACK_KEY, String(it.v)); } catch (e) { /* ignore */ }
      render();
    });

  // A new position starts on its first-in chart, or its first spot when it has none.
  seg('hero-seg', heroes.map((h) => ({ label: h, v: h })),
    (it) => it.v === state.hero, (it) => { state.hero = it.v; state.fam = 'first'; state.vs = null; render(); });

  // Only the spots this position can actually be in.
  seg('fam-seg', fams.map((f) => ({ label: f.label, v: f.id })),
    (it) => it.v === state.fam, (it) => { state.fam = it.v; render(); });

  // First in there is no raiser to pick.
  $('vs-grp').style.display = sp.vs ? '' : 'none';
  seg('vs-seg', opts.map((o) => ({ label: o.vs, v: o.vs })),
    (it) => it.v === state.vs, (it) => { state.vs = it.v; render(); });

  // One chart, nothing to choose: first in there is a single size.
  $('size-grp').style.display = sp.sizes.length > 1 ? '' : 'none';
  seg('size-seg', sp.sizes.map((z) => ({ label: z.face, v: z.face })),
    (it) => it.v === state.face, (it) => { state.face = it.v; render(); });

  let n = 0, raiseW = 0, jamW = 0, callW = 0, foldW = 0;
  cells.forEach((b, i) => {
    const c = now[i];
    b.style.background = paint(c);
    b.classList.remove('linked');                  // the analyzer's pick only marks the spot it came in on
    b.classList.toggle('oor', !!c.oor);
    b.setAttribute('aria-label', c.oor
      ? `${c.h.code}: ${oorText(sp.fam).toLowerCase()}`
      : `${c.h.code}: ${c.r + c.j}% ${c.j > c.r ? 'jam' : word(sp, 'raise')}, ${c.c}% ${word(sp, 'call')}, ${c.f}% fold`);
    b.onmouseenter = () => detail(c);
    b.onfocus = () => detail(c);
    b.onblur = clearDetail;
    // Weighted by combos, so the totals are real frequencies: a pair is 6
    // combos, a suited hand 4 and an offsuit hand 12.
    if (!c.oor) {
      const k = c.h.kind === 'pair' ? 6 : c.h.kind === 's' ? 4 : 12;
      n += k; raiseW += k * c.r; jamW += k * c.j; callW += k * c.c; foldW += k * c.f;
    }
  });

  $('spot-title').textContent = sp.title;
  $('spot-sub').textContent = size.sub;
  const oursLabel = OURS_LABEL[sp.fam];
  $('ours-card').hidden = !oursLabel || size.ours == null;
  if (!$('ours-card').hidden) {
    $('ours').textContent = size.ours;
    $('ours-label').textContent = oursLabel;
    $('ours-sub').textContent = size.sub;
  }

  // The jam entry doubles as the legend for the purple, so it only shows up
  // in the spots that actually have one.
  const d = n || 1;
  $('overall').innerHTML = [['r', raiseW, word(sp, 'raise')], ['j', jamW, 'jam'], ['c', callW, word(sp, 'call')], ['f', foldW, 'fold']]
    .filter(([, v]) => v / d >= 0.05)
    .map(([k, v, nm]) => `<div class="ov-row ${k}"><span>${nm[0].toUpperCase() + nm.slice(1)}</span><span class="pc">${(v / d).toFixed(1)}%</span></div>`).join('');

  $('notes').textContent = sp.note || '';

  // A hand held over from the previous spot would be describing a node we are
  // no longer looking at, so the panel starts empty on every change.
  clearDetail();
}

$('grid').addEventListener('mouseleave', clearDetail);

/* Opened from the analyzer for a hand that is never in our range at a spot:
   ?stack=100&fam=vs3b&hero=CO&vs=BB&face=18bb&hand=94o lands on that spot with
   the hand picked out. Nothing here is saved as a preference. */
const link = new URLSearchParams(location.search);
if (link.get('hero')) {
  const n = Number(link.get('stack'));
  const hit = SPOT_DATA.find((s) => s.stack === n && s.fam === link.get('fam')
    && s.hero === link.get('hero') && s.vs === link.get('vs'));
  if (hit) {
    Object.assign(state, { game: hit.game, stack: hit.stack, hero: hit.hero,
      fam: hit.fam, vs: hit.vs, face: link.get('face') });
  }
}

/* Dark or light. Dark until light is picked; the pick is remembered and
   shared by the other explorers on this login. */
function paintTheme() {
  const cur = document.documentElement.dataset.theme || 'dark';
  seg('theme-seg', [{ label: 'Dark', v: 'dark' }, { label: 'Light', v: 'light' }],
    (it) => it.v === cur,
    (it) => {
      document.documentElement.dataset.theme = it.v;
      try { localStorage.setItem('fe-theme-v1', it.v); } catch (e) { /* ignore */ }
      paintTheme();
    });
}
paintTheme();
render();
clearDetail();
if (link.get('hand')) {
  const i = HANDS.findIndex((h) => h.code === link.get('hand'));
  if (i >= 0) {
    cells[i].classList.add('linked');
    cells[i].focus();
    // A background tab never fires the focus event, so fill the panel directly.
    if (cells[i].onfocus) cells[i].onfocus();
  }
}

})();
</script>

</body>
</html>
