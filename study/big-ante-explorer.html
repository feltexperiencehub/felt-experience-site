<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Big Ante Range Explorer – Felt Experience Poker</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@500;600;700&family=Montserrat:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
</head>
<body>
<style>
  :root {
    --bg: #eef2ec; --panel: #ffffff; --sunk: #e6ebe3; --line: #d5ddd2;
    --ink: #171c18; --muted: #5c665e; --faint: #838d85;
    --raise: #b23a2c; --jam: #7c2d8a; --call: #57a257; --fold: #b9c2b7; --oor: #d3dad1;
    --shadow: 0 1px 2px rgba(20,30,22,.06), 0 6px 18px rgba(20,30,22,.06);
    --focus: #2f6d8f;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0e110e; --panel: #171b17; --sunk: #121612; --line: #262d26;
      --ink: #eaefe8; --muted: #a3ada5; --faint: #78827a;
      --raise: #d2503c; --jam: #9c4bab; --call: #43904a; --fold: #2b322c; --oor: #171b17;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.34);
      --focus: #7fb6d4;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0e110e; --panel: #171b17; --sunk: #121612; --line: #262d26;
    --ink: #eaefe8; --muted: #a3ada5; --faint: #78827a;
    --raise: #d2503c; --jam: #9c4bab; --call: #43904a; --fold: #2b322c; --oor: #171b17;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.34);
    --focus: #7fb6d4;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: Montserrat, ui-sans-serif, system-ui, sans-serif;
    font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased;
  }
  .shell { max-width: 1400px; margin: 0 auto; padding: 22px 20px 52px; }

  h1 {
    font-family: 'League Spartan', system-ui, sans-serif; font-weight: 700;
    font-size: clamp(23px, 2.5vw, 30px); letter-spacing: -.015em;
    margin: 0 0 16px; color: var(--ink);
  }

  .card {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; box-shadow: var(--shadow); padding: 16px;
  }
  .card > h2 {
    font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 11px;
    font-weight: 600; letter-spacing: .13em; text-transform: uppercase;
    color: var(--faint); margin: 0 0 11px;
  }

  /* ---- picker: two groups per row, wrapping ---- */
  .picker { margin-bottom: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 11px; }
  .prow { display: flex; flex-wrap: wrap; gap: 10px 26px; align-items: center; }
  .grp { display: flex; align-items: center; gap: 10px; }
  .lbl {
    font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 11px;
    letter-spacing: .12em; text-transform: uppercase; color: var(--faint); white-space: nowrap;
  }
  .seg { display: flex; flex-wrap: wrap; gap: 3px; background: var(--sunk); border: 1px solid var(--line); border-radius: 9px; padding: 3px; }
  .seg button {
    appearance: none; border: 0; background: transparent; color: var(--muted);
    font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 13.5px;
    padding: 6px 12px; border-radius: 6px; cursor: pointer; white-space: nowrap;
  }
  .seg button:hover:not([disabled]) { color: var(--ink); }
  .seg button[aria-pressed="true"] { background: var(--panel); color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.16); }
  .seg button[disabled] { opacity: .3; cursor: not-allowed; }
  .seg button:focus-visible, .cell:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  .cols { display: grid; grid-template-columns: minmax(0,1fr) 310px; gap: 18px; align-items: start; }

  /* ---- grid ---- */
  .gridhead { display: flex; justify-content: space-between; align-items: baseline; gap: 14px; flex-wrap: wrap; margin-bottom: 12px; }
  .gridhead strong { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 16px; font-weight: 600; }
  .gridhead .sub { display: block; font-size: 13px; color: var(--muted); font-family: Montserrat, sans-serif; font-weight: 400; margin-top: 2px; }
  .mix { font-size: 13.5px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .mix .k { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin: 0 6px 0 14px; }
  .mix .k:first-child { margin-left: 0; }
  .mix .k.r { background: var(--raise); }
  .mix .k.c { background: var(--call); }
  .mix .k.f { background: var(--fold); }

  .gridwrap { overflow-x: auto; }
  .axis, .grid { display: grid; grid-template-columns: repeat(13, minmax(36px, 1fr)); gap: 2px; min-width: 500px; }
  .axis { margin-bottom: 4px; }
  .axis span { text-align: center; font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 11px; color: var(--faint); }

  .cell {
    appearance: none; border: 0; aspect-ratio: 1; border-radius: 4px;
    font-family: 'IBM Plex Mono', ui-monospace, monospace;
    font-size: clamp(9px, .92vw, 11.5px); font-weight: 500; letter-spacing: -.02em;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; position: relative; overflow: hidden;
    color: #fff; transition: opacity .15s ease, transform .1s ease;
  }
  .cell:hover { transform: translateY(-1px); z-index: 4; }
  .cell .t { position: relative; z-index: 2; text-shadow: 0 1px 2px rgba(0,0,0,.55); }
  .cell.oor { color: var(--faint); }
  .cell.oor .t { text-shadow: none; opacity: .55; }
  .cell.dim { opacity: .15; }

  /* ---- rail ---- */
  .rail { display: flex; flex-direction: column; gap: 16px; }
  .big { display: flex; align-items: baseline; gap: 8px; }
  .big .n {
    font-family: 'League Spartan', system-ui, sans-serif; font-size: 40px;
    font-weight: 700; line-height: 1; letter-spacing: -.03em; color: var(--raise);
    font-variant-numeric: tabular-nums;
  }
  .big .u { font-size: 14px; color: var(--muted); }
  .bigsub { margin: 8px 0 0; font-size: 13px; color: var(--muted); }

  .detail .hand { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 27px; font-weight: 600; margin: 0; line-height: 1.1; }
  .detail .verdict { font-size: 14px; font-weight: 600; margin: 3px 0 8px; }
  .detail .nums { margin: 0 0 8px; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .detail .nums b { color: var(--ink); font-weight: 600; }
  .detail .why { margin: 0; font-size: 13px; color: var(--muted); }

  #notes { margin: 0; font-size: 13.5px; color: var(--muted); line-height: 1.5; }
  .foot { margin: 22px 0 0; font-size: 13px; color: var(--faint); }
  .foot a { color: var(--muted); }

  @media (max-width: 920px) {
    .cols { grid-template-columns: minmax(0,1fr); }
    .grp { flex: 1 1 100%; }
  }
</style>

<div class="shell">
  <h1>Big Ante Range Explorer</h1>

  <div class="card picker">
    <div class="prow">
      <div class="grp"><span class="lbl" id="l1">Position</span><div class="seg" role="group" aria-labelledby="l1" id="hero-seg"></div></div>

      <div class="gridwrap">

      <div class="card detail">

        <p class="hand" id="d-hand">—</p>
        <p class="verdict" id="d-verdict">Hover any cell</p>
        <p class="nums" id="d-nums"></p>

      </div>

      <div class="card">
        <h2>Worth remembering</h2>
        <p id="notes"></p>
      </div>
    </div>
  </div>

  <p class="foot"><a href="https://feltexperiencepoker.com" target="_blank" rel="noopener">Felt Experience Poker</a></p>
</div>

/* ===========================================================================
   Big Ante range explorer.
   =========================================================================== */

const RANKS = ['A','K','Q','J','T','9','8','7','6','5','4','3','2'];
const VAL = { A:14,K:13,Q:12,J:11,T:10,9:9,8:8,7:7,6:6,5:5,4:4,3:3,2:2 };

const HANDS = [];
for (let i = 0; i < 13; i++) {
  for (let j = 0; j < 13; j++) {
    const a = VAL[RANKS[i]], b = VAL[RANKS[j]];
    const hi = Math.max(a, b), lo = Math.min(a, b);
    HANDS.push({
      code: i === j ? RANKS[i] + RANKS[i]
        : (i < j ? RANKS[i] + RANKS[j] + 's' : RANKS[j] + RANKS[i] + 'o'),
      kind: i === j ? 'pair' : (i < j ? 's' : 'o'),
      hi, lo, gap: i === j ? 0 : hi - lo - 1,
    });
  }
}

/* Buckets follow the sheets' one-combo-one-bucket order. */
const BUCKETS = [
  { id: 'pairs',  name: 'Pairs',               test: (h) => h.kind === 'pair' },
  { id: 'sbway',  name: 'Suited Broadways',    test: (h) => h.kind === 's' && h.lo >= 10 },
  { id: 'sblock', name: 'Suited Blockers',     test: (h) => h.kind === 's' && h.hi >= 12 && h.lo <= 9 },
  { id: 'sconn',  name: 'Suited Connectivity', test: (h) => h.kind === 's' && h.hi <= 11 && h.lo <= 9 && h.gap <= 2 },
  { id: 'sdis',   name: 'Disconnected Suited', test: (h) => h.kind === 's' && h.hi <= 11 && h.lo <= 9 && h.gap > 2 },
  { id: 'obway',  name: 'Offsuit Broadways',   test: (h) => h.kind === 'o' && h.lo >= 10 },
  { id: 'oblock', name: 'Offsuit Blockers',    test: (h) => h.kind === 'o' && h.hi >= 12 && h.lo <= 9 },
  { id: 'oconn',  name: 'Offsuit Ladders',     test: (h) => h.kind === 'o' && h.hi <= 11 && h.lo <= 9 },
];
HANDS.forEach((h) => { h.bucket = (BUCKETS.find((b) => b.test(h)) || { id: 'other' }).id; });

function decode(row) {
  return row.split(',').map((tok, n) => {
    const h = HANDS[n];
    if (tok === 'X') return { h, oor: true, r: 0, j: 0, c: 0, f: 0 };
    const est = tok.endsWith('!');
    const [r, j, c] = (est ? tok.slice(0, -1) : tok).split('.').map(Number);
    return { h, r, j, c, f: Math.max(0, 100 - r - j - c), est };
  });
}

/* One straight bar per cell: raise, then jam, then call, then fold. No
   hatching, so a 20% fold simply shows as a fifth of the cell in fold grey. */
function paint(c) {
  if (c.oor) return 'var(--oor)';
  const r = c.r, j = r + c.j, k = j + c.c;
  const stops = [];
  if (r > 0) stops.push(`var(--raise) 0 ${r}%`);
  if (c.j > 0) stops.push(`var(--jam) ${r}% ${j}%`);
  if (c.c > 0) stops.push(`var(--call) ${j}% ${k}%`);
  if (c.f > 0) stops.push(`var(--fold) ${k}% 100%`);
  if (!stops.length) return 'var(--fold)';
  if (stops.length === 1) {
    return c.f >= 99.5 ? 'var(--fold)' : c.c >= 99.5 ? 'var(--call)'
      : c.j >= 99.5 ? 'var(--jam)' : 'var(--raise)';
  }
  return `linear-gradient(to right, ${stops.join(', ')})`;
}

function tierName(agg) {
  if (agg >= 99) return 'Pure raise';
  if (agg >= 70) return 'Plenty, not always';
  if (agg >= 50) return 'More than half';
  if (agg >= 25) return 'Under half';
  if (agg >= 8)  return 'A small amount';
  if (agg > 0)   return 'A tiny amount';
  return 'None';
}

const FAM_ORDER = [
  { id: 'rfi',  label: 'vs RFI' },
  { id: 'vs3b', label: 'vs 3-bet' },
  { id: 'limp', label: 'Limp vs ISO' },
];
const HERO_ORDER = ['UTG', 'HJ', 'CO', 'BTN', 'SB', 'BB'];
const OURS_LABEL = { rfi: 'Our 3-bet', vs3b: 'Their 3-bet', limp: 'Our 3-bet' };

const state = { hero: 'SB', fam: 'rfi', vs: null, size: 0 };

const $ = (id) => document.getElementById(id);
const branch = () => SPOT_DATA.filter((s) => s.hero === state.hero && s.fam === state.fam);
const spot = () => branch().find((s) => s.vs === state.vs) || branch()[0] || null;

const cells = [];
(function build() {
  const axis = $('axis');
  RANKS.forEach((r) => {
    const s = document.createElement('span');
    s.textContent = r;
    axis.appendChild(s);
  });
  const grid = $('grid');
  HANDS.forEach((h) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'cell';
    b.innerHTML = '<span class="t"></span>';
    b.querySelector('.t').textContent = h.code;
    grid.appendChild(b);
    cells.push(b);
  });
})();

function seg(id, items, isOn, pick) {
  const box = $(id);
  box.innerHTML = '';
  items.forEach((it) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = it.label;
    b.setAttribute('aria-pressed', String(isOn(it)));
    if (it.off) { b.disabled = true; b.title = 'No data for this position'; }
    else b.addEventListener('click', () => pick(it));
    box.appendChild(b);
  });
}

function clearDetail() {
  $('d-hand').textContent = '—';
  const v = $('d-verdict');
  v.textContent = 'Hover any hand';
  v.style.color = 'var(--muted)';
  $('d-nums').innerHTML = '';
  $('d-why').textContent = '';
}

function detail(c) {
  $('d-hand').textContent = c.h.code;
  const agg = c.r + c.j;
  const v = $('d-verdict');
  if (c.oor) {
    v.textContent = 'Not in our opening range';
    v.style.color = 'var(--muted)';
    $('d-nums').innerHTML = '';
    $('d-why').textContent = 'This hand never reaches the spot, so there is nothing to decide.';
    return;
  }
  v.textContent = agg > 0 ? tierName(agg) : (c.f >= 99 ? 'Fold' : 'Call');
  v.style.color = agg >= 50 ? 'var(--raise)' : agg > 0 ? 'var(--ink)' : c.f >= 99 ? 'var(--muted)' : 'var(--call)';
  const parts = [];
  if (c.r) parts.push(`<b>${c.r}%</b> raise`);
  if (c.j) parts.push(`<b>${c.j}%</b> jam`);
  if (c.c) parts.push(`<b>${c.c}%</b> call`);
  if (c.f) parts.push(`<b>${c.f}%</b> fold`);
  $('d-nums').innerHTML = parts.join(' · ');
  const bucket = BUCKETS.find((b) => b.id === c.h.bucket);
  let why = bucket ? bucket.name + '.' : '';
  if (c.est) why += ' Estimated: this cell was under the cursor in the source capture.';
  $('d-why').textContent = why;
}

function render() {
  const heroes = HERO_ORDER.filter((h) => SPOT_DATA.some((s) => s.hero === h));
  if (!heroes.includes(state.hero)) state.hero = heroes[0];
  const fams = FAM_ORDER.filter((f) => SPOT_DATA.some((s) => s.hero === state.hero && s.fam === f.id));
  if (!fams.some((f) => f.id === state.fam)) state.fam = fams[0].id;
  const opts = branch();
  if (!opts.some((s) => s.vs === state.vs)) state.vs = opts[0] ? opts[0].vs : null;

  const sp = spot();
  if (!sp) return;
  if (state.size >= sp.sizes.length) state.size = 0;
  const size = sp.sizes[state.size];
  const now = decode(size.g);

  seg('hero-seg', heroes.map((h) => ({ label: h, v: h })),
    (it) => it.v === state.hero, (it) => { state.hero = it.v; state.size = 0; render(); });

  seg('fam-seg', FAM_ORDER.map((f) => ({
      label: f.label, v: f.id,
      off: !SPOT_DATA.some((s) => s.hero === state.hero && s.fam === f.id),
    })),
    (it) => it.v === state.fam, (it) => { state.fam = it.v; state.size = 0; render(); });

  seg('vs-seg', opts.map((o) => ({ label: o.vs, v: o.vs })),
    (it) => it.v === state.vs, (it) => { state.vs = it.v; state.size = 0; render(); });

  seg('size-seg', sp.sizes.map((z, i) => ({ label: z.label, v: i })),
    (it) => it.v === state.size, (it) => { state.size = it.v; render(); });

  let n = 0, raiseW = 0, callW = 0, foldW = 0;
  cells.forEach((b, i) => {
    const c = now[i];
    b.style.background = paint(c);
    b.classList.toggle('oor', !!c.oor);
    b.setAttribute('aria-label', c.oor
      ? `${c.h.code}: not in our opening range`
      : `${c.h.code}: ${c.r + c.j}% raise, ${c.c}% call, ${c.f}% fold`);
    b.onmouseenter = () => detail(c);
    b.onfocus = () => detail(c);
    b.onblur = clearDetail;
    if (!c.oor) { n++; raiseW += c.r + c.j; callW += c.c; foldW += c.f; }
  });

  $('spot-title').innerHTML = `${sp.title} · ${size.label}<span class="sub">${size.sub}</span>`;
  $('ours').textContent = size.ours;
  $('ours-label').textContent = OURS_LABEL[sp.fam];
  $('ours-sub').textContent = size.sub;

  const d = n || 1;
  $('mix').innerHTML =
    `<span class="k r"></span>${(raiseW / d).toFixed(1)}% raise` +
    `<span class="k c"></span>${(callW / d).toFixed(1)}% call` +
    `<span class="k f"></span>${(foldW / d).toFixed(1)}% fold`;

  $('notes').textContent = sp.note || '';
}

$('grid').addEventListener('mouseleave', clearDetail);

render();
clearDetail();

})();
</script>
