# Static site: files are committed pre-built, so there is no build step.
[build]
  publish = "."

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Password gate for the private study pages. The function runs before the
# file is served, so the page never reaches a visitor who has not entered the
# password. The password itself lives in the STUDY_PASSWORD environment
# variable in the Netlify UI, never in this repo.
[[edge_functions]]
  path = "/study/*"
  function = "study-gate"

# Separate gate for the heads-up study pages, with its own password
# (HU_PASSWORD in the Netlify UI) so the two groups of pages can be shared
# with different people.
[[edge_functions]]
  path = "/hu/*"
  function = "hu-gate"
